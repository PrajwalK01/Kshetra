<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>RSS Kshetra — My Zones</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23fa4e05' width='100' height='100' rx='20'/><polygon fill='white' points='30,45 50,25 70,45 70,70 60,70 60,55 40,55 40,70 30,70'/></svg>" />
<link rel="stylesheet" href="{{ url_for('static', filename='lib/leaflet.min.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-brand">
      <button class="hamburger" id="hamburger" aria-label="Toggle menu"><span></span></button>
      <div class="brand-icon">ॐ</div>
      <div>
        <span class="brand-name">RSS Kshetra</span>
        <div class="brand-sub">क्षेत्र प्रबंधन</div>
      </div>
    </div>
    <div class="topbar-right">
      {% if current_user.team_name %}<span class="chip">{{ current_user.team_name }}</span>{% endif %}
      <span class="username-tag">{{ current_user.username }}</span>
      <a class="btn-logout" href="{{ url_for('logout') }}">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Log out
      </a>
    </div>
  </div>

  <div id="body-row">
    <div id="sidebar-scrim" aria-hidden="true"></div>

    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-scroll">

        <!-- Assigned Zones -->
        <div class="panel-section">
          <div class="section-header">
            <span class="section-label">Assigned to you</span>
            <span class="section-count" id="zone-count">0</span>
          </div>
          <p class="section-hint">Tap a zone to jump to it. Update status as work progresses.</p>
          <div class="list-wrap" id="zone-list"></div>
        </div>

        <!-- Pins -->
        <div class="panel-section">
          <div class="section-header">
            <span class="section-label">Field Notes</span>
            <span class="section-count" id="pin-count">0</span>
          </div>
          <div class="list-wrap" id="pin-list"></div>
        </div>

      </div>
    </div>

    <!-- Map -->
    <div id="map-wrap">
      <div id="map"></div>
      <button id="loc-btn" title="Go to my location" aria-label="Go to my location">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/></svg>
      </button>
    </div>
  </div>

</div>
<script src="{{ url_for('static', filename='lib/leaflet.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/user.js') }}"></script>
</body>
</html>
